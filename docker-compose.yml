version: "3.8"
services:
  backend:
    container_name: lexora-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    # Ensure the app reaches the compose Redis service even if backend/.env still says 127.0.0.1
    environment:
      REDIS_HOST: redis
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||'5000')+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - lexora

  frontend:
    container_name: lexora-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3100:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lexora

  mongo:
    container_name: lexora-mongo
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lexora

  redis:
    container_name: lexora-redis
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lexora

networks:
  lexora:
    driver: bridge

volumes:
  mongo-data:
